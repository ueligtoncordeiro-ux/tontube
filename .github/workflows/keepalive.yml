name: Keep Alive

on:
  schedule:
    - cron: "*/10 * * * *"   # a cada 10 minutos
  workflow_dispatch:           # permite rodar manualmente

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping TonTube
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.APP_URL }}/health" --max-time 15)
          echo "Status: $STATUS"
          [ "$STATUS" = "200" ] && echo "✅ Online" || echo "⚠️ Não respondeu (pode estar acordando)"
